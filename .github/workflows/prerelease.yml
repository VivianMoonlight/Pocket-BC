name: Android pre-release

on:
  push:
    tags:
      - 'v*-alpha.*'

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test and build preview APK
        run: bash ./gradlew testDebugUnitTest assembleDebug
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Pocket-BC-${RELEASE_TAG}-debug.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt \
            --verify-tag --prerelease --latest=false \
            --title "Pocket BC ${RELEASE_TAG} · 未完成预览版" \
            --notes-file docs/prerelease-notes.md
